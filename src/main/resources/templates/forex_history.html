<!DOCTYPE HTML>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::article})}">

<head>
  <title>Forex HistÁr</title>
</head>

<body>

<article class="panel">
  <header>
    <h2>Forex HistÁr</h2>
    <p>Historikus árfolyamok lekérése</p>
  </header>

  <form th:action="@{/forex/history}" method="get">
    <div class="row">
      <div class="col-12">
        <label for="instrument">Devizapár</label>
        <select name="instrument" id="instrument">
          <option th:each="item : ${instruments}"
                  th:value="${item}"
                  th:text="${item}"
                  th:selected="${item == selectedInstrument}">
          </option>
        </select>
      </div>

      <div class="col-12">
        <label for="granularity">Időintervallum</label>
        <select name="granularity" id="granularity">
          <option th:each="item : ${granularities}"
                  th:value="${item}"
                  th:text="${item}"
                  th:selected="${item == selectedGranularity}">
          </option>
        </select>
      </div>
    </div>

    <ul class="actions">
      <li>
        <input type="submit" value="Historikus árak lekérése"/>
      </li>
    </ul>
  </form>

  <div th:if="${error != null}">
    <p th:text="${error}"></p>
  </div>

  <div th:if="${historyData != null}"
       id="history-data"
       th:attr="data-history=${historyData},data-instrument=${selectedInstrument},data-granularity=${selectedGranularity}">

    <h3>Utolsó 10 gyertya adatai</h3>

    <p id="history-info"></p>

    <div style="overflow-x: auto;">
      <table id="history-table">
        <thead>
        <tr>
          <th>Időpont</th>
          <th>Open</th>
          <th>High</th>
          <th>Low</th>
          <th>Close</th>
          <th>Volume</th>
        </tr>
        </thead>
        <tbody id="history-body">
        </tbody>
      </table>
    </div>

    <p id="history-error"></p>
  </div>

  <p>
    <a th:href="@{/forex/price}">Forex AktÁr</a>
  </p>

  <p>
    <a th:href="@{/forex/account}">Forex Account</a>
  </p>

  <p>
    <a th:href="@{/forex/open}">Forex Nyit</a>
  </p>

  <p>
    <a th:href="@{/forex/positions}">Forex Poz</a>
  </p>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("history-data");

      if (!container) {
        return;
      }

      try {
        const data = JSON.parse(container.dataset.history);
        const candles = data.candles || [];
        const tbody = document.getElementById("history-body");

        document.getElementById("history-info").textContent =
                container.dataset.instrument + " | Időintervallum: " +
                container.dataset.granularity;

        candles.forEach(function (candle) {
          const mid = candle.mid || {};
          const row = document.createElement("tr");

          const date = candle.time
                  ? new Date(candle.time).toLocaleString("hu-HU")
                  : "-";

          const values = [
            date,
            mid.o || "-",
            mid.h || "-",
            mid.l || "-",
            mid.c || "-",
            candle.volume ?? "-"
          ];

          values.forEach(function (value) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });

        if (candles.length === 0) {
          document.getElementById("history-error").textContent =
                  "Nem érkezett historikus adat.";
        }

      } catch (error) {
        document.getElementById("history-error").textContent =
                "A historikus adatok feldolgozása sikertelen.";
        console.error(error);
      }
    });
  </script>

  <style>
    #history-table {
      width: 100%;
      min-width: 700px;
    }

    #history-table th,
    #history-table td {
      padding: 0.8em;
      text-align: center;
      white-space: nowrap;
    }

    #history-table tbody tr:nth-child(even) {
      background: #f5f5f5;
    }

    #history-info {
      margin-bottom: 1em;
      font-weight: bold;
    }

    #history-error {
      color: #b00020;
    }
  </style>
</article>

</body>
</html>
