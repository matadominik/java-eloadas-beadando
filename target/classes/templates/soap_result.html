<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::article})}">

<head>
    <title>MNB árfolyamok</title>
</head>

<body>

<article class="panel">
    <p th:text="'Deviza: ' + ${currency}"></p>
    <div class="table-wrapper">
        <table style="width: 100%; table-layout: fixed; text-align: center;">
            <thead>
            <tr>
                <th style="width: 50%; text-align: center;">Dátum</th>
                <th style="width: 50%; text-align: center;">Árfolyam (HUF)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rates}">
                <td style="text-align: center;" th:text="${r.datum()}"></td>
                <td style="text-align: center;" th:text="${r.ertek()}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <h2>Árfolyam grafikon</h2>
    <div style="width: 100%; max-width: 900px;">
        <canvas id="arfolyamChart"></canvas>
    </div>
    <a th:href="@{/soap}">Vissza az űrlaphoz</a>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {

            const rates = /*[[${rates}]]*/ [];

            const labels = rates.map(rate => rate.datum);
            const values = rates.map(rate => rate.ertek);

            const ctx = document.getElementById('arfolyamChart');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: /*[[${currency}]]*/ 'EUR',
                        data: values,
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.15)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'MNB árfolyam alakulása'
                        },
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Árfolyam (HUF)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Dátum'
                            }
                        }
                    }
                }
            });
        });
    </script>
</article>

</body>
</html>
