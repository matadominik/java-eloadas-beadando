<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MNB árfolyamok</title>
</head>
<body>
<h1>MNB árfolyam lekérdezés</h1>
<form th:action="@{/soap}" th:object="${param}" method="post">
    Deviza:
    <select th:field="*{currency}">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="GBP">GBP</option>
        <option value="JPY">JPY</option>
    </select><br>
    Kezdő dátum: <input type="date" th:field="*{startDate}"><br>
    Befejező dátum: <input type="date" th:field="*{endDate}"><br>
    <input type="submit" value="Lekérdezés">
</form>
</body>
</html>
