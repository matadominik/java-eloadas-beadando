
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::article})}">

<head>
    <title>MNB árfolyamok</title>
</head>

<body>

<article class="panel">
    <header>
        <h2>MNB árfolyamlekérdezés</h2>
        <p>Válaszd ki a kívánt devizát és az időszakot!</p>
    </header>

    <form th:action="@{/soap}" th:object="${param}" method="post">

        <div class="row">
            <div class="col-12">
                <label for="currency">Deviza</label>
                <select id="currency" th:field="*{currency}">
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                </select>
            </div>

            <div class="col-6 col-12-small">
                <label for="startDate">Kezdő dátum</label>
                <input id="startDate" type="date" th:field="*{startDate}">
            </div>

            <div class="col-6 col-12-small">
                <label for="endDate">Befejező dátum</label>
                <input id="endDate" type="date" th:field="*{endDate}">
            </div>

            <div class="col-12">
                <input type="submit" value="Lekérdezés">
            </div>
        </div>

    </form>
</article>

</body>
</html>
